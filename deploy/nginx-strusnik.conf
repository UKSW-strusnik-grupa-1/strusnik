# Strusnik reverse proxy for the existing GymSoftware nginx container.
# Install this file in the infrastructure-owned nginx container.
server {
    listen 80;
    server_name strusnik.pl www.strusnik.pl;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name strusnik.pl www.strusnik.pl;

    ssl_certificate /etc/letsencrypt/live/strusnik.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/strusnik.pl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /socket.io/ {
        proxy_pass http://172.17.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location / {
        proxy_pass http://172.17.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
